<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>WebSite Generator</title>
</head>
<body>
    {% for blocco in blocchi %}
    
        <div class="blocco-renderizzato">
            {% if blocco.tipo == 'titolo' %}
                <h1>{{ blocco.contenuto }}</h1>
                
            {% elif blocco.tipo == 'testo' %}
                <p>{{ blocco.contenuto }}</p>
                
            {% elif blocco.tipo == 'immagine' %}
                <img src="{{ blocco.contenuto }}" alt="Immagine" style="max-width: 100%;">
                
            {% endif %}
        </div>
        
    {% endfor %}
</body>
</html>
